<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Apply the saved theme before first paint (dark is the default).
      (function () {
        try {
          var stored = localStorage.getItem("phantix_theme");
          var dark;
          if (stored === "light") dark = false;
          else if (stored === "system")
            dark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          else dark = true; // "dark" or unset -> dark (historical default)
          if (dark) document.documentElement.removeAttribute("data-theme");
          else document.documentElement.setAttribute("data-theme", "light");
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", dark ? "#0D1B3D" : "#F4F6FA");
        } catch (e) { /* ignore */ }
      })();
    </script>
    <link rel="icon" href="/favicon.ico" sizes="48x48" />

    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
